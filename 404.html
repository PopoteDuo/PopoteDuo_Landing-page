<head>

<body class="lost-page">
<main class="lost">
  <img src="/assets/img/pepin-3d.webp" alt="" width="512" height="512">
  <p class="pill"><span class="dot"></span>Erreur 404</p>
  <h1 class="h1">Cette page n’est pas dans la recette</h1>

<script>/* Même règle de langue que l'accueil : le choix FR / EN retenu, sinon la langue du navigateur. */
(function(){var c=null;try{c=localStorage.getItem('popote-lang')}catch(e){}var b=((navigator.languages&&navigator.languages[0])||navigator.language||'fr').toLowerCase();if((c||(b.indexOf('fr')===0?'fr':'en'))!=='en')return;
document.documentElement.lang='en';document.title='Page not found · Popote Duo';var q=function(s){return document.querySelector(s)};
q('.pill').lastChild.textContent='Error 404';q('h1').textContent='This page isn’t in the recipe';q('.lead').textContent='The link may be incomplete, or the page has moved. Pépin will take you back to the kitchen.';var a=q('.btn');a.textContent='Back to the home page';a.href='/en'})();</script>
</body>
